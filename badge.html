<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Your Badge — DH24</title>
<style>
  :root{
    --bg-dark:#060a12; --glass-border:rgba(20,42,62,.8); --text-primary:#e8edf5;
    --text-secondary:#7a8599; --accent-green:#00ff88; --bg-card-solid:#0c1926;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-dark);color:var(--text-primary);font-family:Inter,system-ui,Arial,sans-serif;padding:32px 20px;}
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-family:'Bebas Neue',Arial,sans-serif;letter-spacing:2px;font-size:2.4rem;margin:0 0 4px;}
  h1 span{color:var(--accent-green);}
  .sub{color:var(--text-secondary);font-size:.95rem;margin-bottom:26px;}
  .panel{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start;}
  .controls{flex:1;min-width:260px;display:flex;flex-direction:column;gap:18px;}
  label{display:block;font-size:.8rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;}
  input[type=text]{width:100%;background:var(--bg-card-solid);border:1px solid var(--glass-border);color:var(--text-primary);
    border-radius:10px;padding:12px 14px;font-size:1rem;outline:none;}
  input[type=text]:focus{border-color:var(--accent-green);}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;}
  .swatch{width:34px;height:34px;border-radius:8px;border:2px solid transparent;cursor:pointer;}
  .swatch.active{border-color:var(--accent-green);}
  .rowbtn{cursor:pointer;font-size:.82rem;color:var(--text-secondary);border:1px solid var(--glass-border);border-radius:8px;padding:8px 14px;}
  .rowbtn.active{border-color:var(--accent-green);color:var(--accent-green);font-weight:600;}
  .preview-col{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .preview-circle{width:240px;height:240px;border-radius:50%;overflow:hidden;border:1px solid var(--glass-border);background:#000;}
  .preview-circle canvas{width:100%;height:100%;display:block;}
  .hint{color:var(--text-secondary);font-size:.78rem;text-align:center;max-width:240px;}
  .btn{background:var(--accent-green);color:#04110a;border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:.95rem;cursor:pointer;}
  .btn:hover{filter:brightness(1.08);}
  a.back{color:var(--text-secondary);font-size:.85rem;text-decoration:none;}
  a.back:hover{color:var(--text-primary);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Back</a>
  <h1>MAKE YOUR <span>BADGE</span></h1>

  <div class="panel">
    <div class="controls">
      <div>
        <label>Rows</label>
        <div class="swatches" id="row-toggle">
          <span class="rowbtn active" onclick="setRows(1)">1 Row</span>
          <span class="rowbtn" onclick="setRows(2)">2 Rows</span>
        </div>
      </div>
      <div id="line1-wrap">
        <label for="line1" id="line1-label">Text</label>
        <input id="line1" type="text" maxlength="6" value="DH" autocomplete="off" placeholder="e.g. JS">
      </div>
      <div id="line2-wrap" style="display:none;">
        <label for="line2">Bottom row</label>
        <input id="line2" type="text" maxlength="6" value="" autocomplete="off" placeholder="e.g. 24">
      </div>
      <div>
        <label>Text color</label>
        <div class="swatches" id="ink-swatches"></div>
      </div>
      <button class="btn" id="download">Download PNG</button>
    </div>

    <div class="preview-col">
      <div class="preview-circle"><canvas id="canvas" width="600" height="600"></canvas></div>
      <div class="hint">Circular preview = how it looks as a DK avatar.</div>
    </div>
  </div>
</div>

function setRows(n) {
  rows = n;
  document.querySelectorAll('#row-toggle .rowbtn').forEach((b, i) => b.classList.toggle('active', i === (n - 1)));
  document.getElementById('line2-wrap').style.display = n === 2 ? '' : 'none';
  document.getElementById('line1-label').textContent = n === 2 ? 'Top row' : 'Text';
  draw();
}

function makeSwatches() {
  const el = document.getElementById('ink-swatches');
  el.innerHTML = '';
  inkColors.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c === ink ? ' active' : '');
    s.style.background = c;
    if (c === '#ffffff') s.style.boxShadow = 'inset 0 0 0 1px #888';
    s.onclick = () => { ink = c; makeSwatches(); draw(); };
    el.appendChild(s);
  });
}
makeSwatches();

function draw() {
  ctx.clearRect(0, 0, SIZE, SIZE);

  // 1) the badge frame image, untouched
  if (frameOk) ctx.drawImage(frame, 0, 0, SIZE, SIZE);

  // 2) the initials, on top, centered inside the octagon.
  const l1 = (document.getElementById('line1').value || '').toUpperCase().trim();
  const l2 = (document.getElementById('line2').value || '').toUpperCase().trim();
  const lines = (rows === 2 ? [l1, l2] : [l1]).filter(Boolean);
  if (!lines.length) return;
  ctx.fillStyle = ink;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const maxW = SIZE * 0.46;
  let fontSize = lines.length === 1 ? SIZE * 0.30 : SIZE * 0.22;
  do {
    ctx.font = `900 ${fontSize}px Arial, sans-serif`;
    const widest = Math.max(...lines.map(l => ctx.measureText(l).width));
    if (widest <= maxW) break;
    fontSize -= 5;
  } while (fontSize > 16);
  ctx.font = `900 ${fontSize}px Arial, sans-serif`;
  const lineH = fontSize * 1.02;
  const cx = SIZE / 2, cy = SIZE / 2 + SIZE * 0.05;
  let y = cy - (lineH * (lines.length - 1)) / 2;
  lines.forEach(l => { ctx.fillText(l, cx, y); y += lineH; });
}

document.getElementById('line1').addEventListener('input', draw);
document.getElementById('line2').addEventListener('input', draw);
document.getElementById('download').addEventListener('click', () => {
  const finish = (url, revoke) => {
    const a = document.createElement('a');
    a.download = 'badge.png';
    a.href = url;
    document.body.appendChild(a);   // some browsers require the link in the DOM
    a.click();
    document.body.removeChild(a);
    if (revoke) setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  try {
    if (canvas.toBlob) {
      canvas.toBlob(blob => {
        if (blob) finish(URL.createObjectURL(blob), true);
        else finish(canvas.toDataURL('image/png'), false);
      }, 'image/png');
    } else {
      finish(canvas.toDataURL('image/png'), false);
    }
  } catch (e) {
    alert('Could not export the image: ' + e.message);
  }
});

draw();
</script>
